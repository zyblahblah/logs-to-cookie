[project]
name = "logs-to-cookie"
version = "2.0.0"
description = "Telegram bot that converts log archives into Netscape cookie files via an interactive /start flow."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.6",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "aiohttp==3.10.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"
