[project]
name = "logs-to-cookie"
version = "1.0.0"
description = "Telegram bot that streams a direct-link log file and exports each Netscape cookie as its own .txt file."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.6",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
