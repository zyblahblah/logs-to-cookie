[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logs-to-cookie"
version = "0.7.0"
description = "Sort stealer-style logs and convert them to ULP and cookie formats."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zyblahblah" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
logs-to-cookie = "logs_to_cookie.cli:main"

[tool.setuptools.packages.find]
include = ["logs_to_cookie*"]
exclude = ["tests*", "samples*"]
